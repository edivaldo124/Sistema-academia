services:
  - type: web
    name: web-academia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn servidor:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
