<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tela Inicial - Academia</title>
    <link rel="stylesheet" href="../static/css/index.css">
    <link rel="stylesheet" href="../static/css/moldaljs.css">
</head>
<body>
    <div class="conteudo">
        <img width="150px" height="80px" src="../static/imagens/logo.png">

        <div class="botoes-container">
            <button type="button" class="btn btn-login" onclick="abrirmodal()">Entrar</button>
            <a href="/cadastrar" class="btn btn-cadastro">Cadastrar</a>
        </div>
    </div>

    <div id="meuModal" class="modal">
        <div class="modal-conteudo">
            <button type="button" class="fechar-modal" onclick="fechar()" aria-label="Fechar">
                &times;
            </button>

            <form action="/login" method="post">
                <h2>PAGINA DE LOGIN</h2>
                <label>Usuario:</label>
                <input type="text" id="inputnome" name="loginusuario">
                <label>Senha:</label>

                <div class="campo-senha">
                    <input type="password" id="senhausuario" name="senhausuario">
                    <button
                        type="button"
                        id="iconeSenha"
                        class="icone-senha"
                        onclick="mostrarSenha()"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M2.5 12C4.5 8.3 7.7 6 12 6s7.5 2.3 9.5 6c-2 3.7-5.2 6-9.5 6S4.5 15.7 2.5 12Z"></path>
                            <circle cx="12" cy="12" r="2.8"></circle>
                            <line class="icone-risco" x1="4" y1="4" x2="20" y2="20"></line>
                        </svg>
                    </button>
                </div>
                <button type="submit">ENTRAR</button>
            </form>
            <a href="/recuperar_senha" class="recuperar">RECUPERAR SENHA</a><br>
            <a href="/cadastrar" class="meulink">Não tem conta? Cadastre-se</a>
        </div>
    </div>

    <script src="../static/js/index.js"></script>
</body>
</html>
