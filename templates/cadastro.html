<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../static/css/cadastro.css">
</head>
<body>
{%if erro%}
    <div class="msg">
   {{erro}}
    </div>
{%endif%}

        <a href="/logout">sair</a>
    <div class="conteudo">
        <form action="/cadastrar" method="post">
            <p>PAGINA DE CADASTRO</p>
            <label>Nome</label><br>
            <input type="text" name="nomeusuario" maxlength="150" required><br>
            <label>Usuario</label><br>
            <input type="text" name="loginusuario" maxlength="50" required><br>
            <label>Data de Nascimento</label><br>
            <input type="date" name="dataNascimento" required><br>
            <label>Senha:</label><br>
            <input type="password" name="senhausuario" maxlength="255" required><br>
            <label>Email</label><br>
            <input type="email" name="emailusuario" maxlength="150" required><br>
            <label>Telefone</label><br>
            <input type="tel" name="telefoneusuario" maxlength="20" required><br>
            <label>CPF</label><br>
            <input type="text" name="cpfusuario" maxlength="14" required><br>
            <label>Descrição:</label><br>
            <input type="text" name="descricaousuario" maxlength="255" placeholder="se tem algum problema de saude"><br>
            <button type="submit">CADASTRAR</button>
        </form>
    </div>
</body>
</html>
