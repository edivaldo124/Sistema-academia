<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link rel="stylesheet" href="../static/css/cadastro.css">
</head>
<body>
    <div class="formulario">
        <form action="/perfil" method="post">
            <h2>PERFIL DO ALUNO</h2>
            <br>
            <label>Nome: {{ usuario.nome }}</label><br>
            <label>Plano: {{ usuario.plano }}</label><br>
            <label>Status: {{ usuario.mensalidade }}</label><br>
            <br>

            <label>Escolha ou Altere seu Plano:</label><br>

            <select name="plano" style="width: 200px; height: 30px; border-radius: 6px; margin-top: 5px; margin-bottom: 10px;">
                <option value="Nenhum">Selecione um plano</option>
                {% for plano in planos %}
                    <option value="{{ plano[0] }}">{{ plano[0] }} (R$ {{ plano[1] }})</option>
                {% endfor %}
            </select><br>

            <button type="submit">SALVAR PLANO</button>
        </form>
        <br>
        <a href="/" class="meulink">Voltar ao Início</a>
    </div>
</body>
</html>
