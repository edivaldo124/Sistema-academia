<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
    <div class="confirm-accent" aria-hidden="true"></div>
    <div class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
            <path d="M12 8v5m0 3.5v.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
    </div>
    <p class="eyebrow" id="confirm-dialog-eyebrow">Confirmar ação</p>
    <h2 id="confirm-dialog-title">Você tem certeza?</h2>
    <p id="confirm-dialog-message">Revise esta ação antes de continuar.</p>
    <div class="confirm-actions">
        <button type="button" class="confirm-cancel" data-modal-cancel>Cancelar</button>
        <button type="button" class="confirm-accept" data-modal-accept>Confirmar</button>
    </div>
</dialog>
